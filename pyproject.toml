[project]
name = "silicate"
version = "0.1.0"
description = "AI level generator for Geometry Dash (Gemini by default)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
silicate = "silicate.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["silicate"]
