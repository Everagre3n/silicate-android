name: Build Silicate

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
      - name: Dump SDK headers (diagnostic)
        if: always() && matrix.config.target == 'Android64'
        run: |
          for pat in 'Popup.hpp' 'web.hpp' 'TextInput.hpp' 'async.hpp' 'Task.hpp' 'ZipUtils.hpp' 'LocalLevelManager.hpp'; do
            for f in $(find . -path '*include/Geode*' -name "$pat" -o -path '*bindings/Geode*' -name "$pat" | head -3); do
              echo "=====HEADER $f"; cat "$f" | head -400
            done
          done
          grep -rn "static.*compressString\|compressString" --include=*.hpp . | head -5

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: silicate-geode
          path: ${{ steps.build.outputs.build-output }}
